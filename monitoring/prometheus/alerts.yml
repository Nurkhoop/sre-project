groups:
  - name: sre-microservices-alerts
    rules:
      - alert: OrderServiceDown
        expr: up{job="order-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Order Service is down"
          description: "Prometheus cannot scrape order-service. Check Docker status, logs, and DB configuration."

      - alert: AnyMicroserviceDown
        expr: up{job=~"auth-service|user-service|product-service|order-service|payment-service|chat-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A backend microservice is down"
          description: "One of the FastAPI services is unavailable and needs investigation."

      - alert: PaymentServiceDown
        expr: up{job="payment-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Payment Service is down"
          description: "Prometheus cannot scrape payment-service. Check Docker status, logs, and database connectivity."

      - alert: HighErrorRate
        expr: sum by (job) (rate(http_requests_total{job=~"auth-service|user-service|product-service|order-service|payment-service|chat-service", status=~"5.."}[2m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"
          description: "A backend service is returning elevated 5xx responses. Check service logs and recent deployments."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket{job=~"auth-service|user-service|product-service|order-service|payment-service|chat-service"}[5m]))) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency"
          description: "p95 latency is above one second. Inspect capacity, database response time, and downstream dependencies."

      - alert: OrderServiceHighLoad
        expr: sum(rate(http_requests_total{job="order-service"}[1m])) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Order Service request load is high"
          description: "Order Service RPS is above the assignment threshold. Consider horizontal scaling and database optimization."

      - alert: HighContainerCpuUsage
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[2m])) * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High container CPU usage"
          description: "A container is using high CPU for several minutes. Review load test results and scaling options."

      - alert: HighContainerMemoryUsage
        expr: container_memory_working_set_bytes{name!=""} > 400000000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High container memory usage"
          description: "A service container is using more than 400 MB working memory."

      - alert: PossibleContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[10m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Possible container restart loop"
          description: "A container start time changed multiple times. Inspect Docker health status and logs."
