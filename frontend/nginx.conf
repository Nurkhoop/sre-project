server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8000/auth/;
    }

    location /api/users/ {
        proxy_pass http://user-service:8000/users/;
    }

    location /api/products/ {
        proxy_pass http://product-service:8000/products/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8000/orders/;
    }

    location /api/payments/ {
        proxy_pass http://payment-service:8000/payments/;
    }

    location /api/chat/ {
        proxy_pass http://chat-service:8000/chat/;
    }

    location = /health/auth {
        proxy_pass http://auth-service:8000/health;
    }

    location = /health/users {
        proxy_pass http://user-service:8000/health;
    }

    location = /health/products {
        proxy_pass http://product-service:8000/health;
    }

    location = /health/orders {
        proxy_pass http://order-service:8000/health;
    }

    location = /health/payments {
        proxy_pass http://payment-service:8000/health;
    }

    location = /health/chat {
        proxy_pass http://chat-service:8000/health;
    }
}
