name: Release Images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - chat-service
          - frontend
          - db-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS=()

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS+=("${IMAGE}:main-${SHORT_SHA}")
            TAGS+=("${IMAGE}:latest")
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS+=("${IMAGE}:${GITHUB_REF_NAME}")
          fi

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
