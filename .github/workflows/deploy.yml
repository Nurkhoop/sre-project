name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy, for example latest or main-abc1234
        required: true
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/sre-microservices' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${MANUAL_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "Deploying ${IMAGE_REPOSITORY}:${MANUAL_IMAGE_TAG}"

      - name: Install Ansible
        run: python3 -m pip install ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Create inventory
        run: |
          cat > ansible/inventory.ci.ini <<EOF
          [sre_nodes]
          sre-vm ansible_host=${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }}

          [sre_nodes:vars]
          app_dir=${APP_DIR}
          repo_url=https://github.com/${{ github.repository }}.git
          install_kubernetes=true
          deploy_kubernetes_manifests=false
          EOF

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ci.ini ansible/deploy.yml \
            --extra-vars "repo_version=${DEPLOY_BRANCH} image_repository=${IMAGE_REPOSITORY} image_tag=${IMAGE_TAG}"

      - name: Post-deployment smoke test
        env:
          BASE_URL: http://${{ secrets.VM_HOST }}
          PROMETHEUS_URL: http://${{ secrets.VM_HOST }}:9090/-/healthy
          GRAFANA_URL: http://${{ secrets.VM_HOST }}:3000/api/health
        run: ./scripts/smoke-test.sh
