name: Deploy

on:
  workflow_run:
    workflows: ["Release Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/sre-microservices' }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"

          ssh -i ~/.ssh/id_rsa "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd '${APP_DIR}' && \
             git pull && \
             IMAGE_REPOSITORY='${IMAGE_REPOSITORY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml pull && \
             IMAGE_REPOSITORY='${IMAGE_REPOSITORY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml up -d --no-build"

      - name: Smoke test
        env:
          BASE_URL: http://${{ secrets.VM_HOST }}
          PROMETHEUS_URL: http://${{ secrets.VM_HOST }}:9090/-/healthy
          GRAFANA_URL: http://${{ secrets.VM_HOST }}:3000/api/health
        run: ./scripts/smoke-test.sh
