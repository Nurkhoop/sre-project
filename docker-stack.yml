services:
  auth-service:
    image: sre-auth-service:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@app-db:5432/app_db_dev
    ports:
      - "8001:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  user-service:
    image: sre-user-service:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@app-db:5432/app_db_dev
    ports:
      - "8002:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  product-service:
    image: sre-product-service:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@app-db:5432/app_db_dev
    ports:
      - "8003:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  order-service:
    image: sre-order-service:latest
    environment:
      DB_HOST: app-db
      DB_PORT: 5432
      DB_NAME: app_db_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
    ports:
      - "8004:8000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        order: start-first
      resources:
        reservations:
          cpus: "0.20"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 512M

  payment-service:
    image: sre-payment-service:latest
    environment:
      DB_HOST: app-db
      DB_PORT: 5432
      DB_NAME: app_db_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      ORDER_SERVICE_URL: http://order-service:8000
    ports:
      - "8006:8000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        order: start-first
      resources:
        reservations:
          cpus: "0.20"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 512M

  chat-service:
    image: sre-chat-service:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@app-db:5432/app_db_dev
    ports:
      - "8005:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  app-db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: app_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 1G

  frontend:
    image: sre-frontend:latest
    ports:
      - "80:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.05"
          memory: 64M
        limits:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.51.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M

configs:
  prometheus_config:
    file: ./monitoring/prometheus/prometheus.yml
  prometheus_alerts:
    file: ./monitoring/prometheus/alerts.yml

volumes:
  postgres-data:
